<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças do Caio</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0F1115">
<style>
  /* so a tela de chave; o resto do visual vem do proprio app depois de aberto.
     Tema escuro fixo, como o app (27/11/2026). */
  html{background:#0F1115;color-scheme:dark}
  #bloqueio{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:24px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#E7E9EE;background:#0F1115;-webkit-text-size-adjust:100%}
  #bloqueio .caixa{width:100%;max-width:380px}
  #bloqueio h1{font-size:22px;margin:0 0 6px;font-weight:600}
  #bloqueio p{margin:0 0 16px;color:#9AA3AF;font-size:14.5px;line-height:1.45}
  #bloqueio input{display:block;width:100%;margin-top:10px;font:inherit;font-size:16px;padding:12px;border:1px solid #2A2F3A;
    border-radius:10px;background:#181B22;color:#E7E9EE}
  #bloqueio button{width:100%;margin-top:12px;font:inherit;font-size:16px;font-weight:700;padding:12px;
    border:0;border-radius:10px;background:#22C55E;color:#06210F}
  #bloqueio button:disabled{opacity:.6}
  #bloqueio .erro{color:#F87171;margin:10px 0 0;min-height:1.4em;font-size:14px}
  #bloqueio .nota{margin-top:18px;font-size:12.5px}
</style>
</head>
<body>
<main id="bloqueio">
  <form class="caixa" id="form-chave" autocomplete="off">
    <h1>Finanças do Caio</h1>
    <p id="msg-chave">Cole a chave do cofre e o token de leitura do GitHub. Os dois ficam só neste aparelho.</p>
    <input id="chave" type="password" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="Chave do cofre" aria-label="Chave do cofre" required>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="Token de leitura do GitHub" aria-label="Token de leitura do GitHub" required>
    <button type="submit" id="abrir">Abrir</button>
    <div class="erro" id="erro" role="alert"></div>
    <p class="nota">Este site não guarda número nenhum. Os dados vêm cifrados do repositório privado e só abrem aqui, no aparelho.</p>
  </form>
</main>
<script src="cofre.js"></script>
<script src="app.js"></script>
</body>
</html>
